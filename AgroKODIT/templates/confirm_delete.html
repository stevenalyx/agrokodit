{% extends "base.html" %}
{% block title %}Confirmar eliminación{% endblock %}

{% block content %}
<div class="card shadow-sm form-card border-danger">
  <div class="card-body p-4">
    <h1 class="h3 mb-3">Confirmar eliminación</h1>
    <p>¿Seguro que quieres eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer y también borrará los registros que dependen de este.</p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a class="btn btn-outline-secondary" href="{{ view.success_url }}">No, volver</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
