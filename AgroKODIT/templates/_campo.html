<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
    {{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}
  </label>

  {{ field }}

  {% if field.help_text %}
  <div id="{{ field.id_for_label }}_help" class="form-text">{{ field.help_text }}</div>
  {% endif %}

  {% if field.errors %}
  <div id="{{ field.id_for_label }}_error" class="invalid-feedback d-block fw-semibold" role="alert">
    <span class="visually-hidden">Error:</span> {{ field.errors|join:" " }}
  </div>
  {% endif %}
</div>
